<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Résultats Élection 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #4361ee, #3a0ca3); color: white; padding: 30px; border-radius: 15px; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #4361ee; font-size: 2rem; margin-bottom: 10px; }
        .results { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: bold; color: #333; }
        .winner { background: rgba(46, 204, 113, 0.1); border-left: 4px solid #2ecc71; }
        .btn { padding: 12px 25px; background: #4361ee; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
        .btn:hover { background: #3a0ca3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-lock"></i> Administration - Résultats 2026</h1>
            <p>Cours privés La Source de la Fontaine</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalVotes">0</h3>
                <p>Votes totaux</p>
            </div>
            <div class="stat-card">
                <h3 id="participationRate">0%</h3>
                <p>Taux de participation</p>
            </div>
            <div class="stat-card">
                <h3 id="remainingVotes">0</h3>
                <p>Votes restants</p>
            </div>
            <div class="stat-card">
                <h3 id="timeRemaining">0j</h3>
                <p>Temps restant</p>
            </div>
        </div>
        
        <div class="results">
            <h2><i class="fas fa-chart-bar"></i> Résultats détaillés</h2>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Rang</th>
                        <th>Candidate</th>
                        <th>Classe</th>
                        <th>Votes</th>
                        <th>Pourcentage</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Résultats chargés dynamiquement -->
                </tbody>
            </table>
        </div>
        
        <div style="margin-top: 30px;">
            <button class="btn" onclick="loadResults()"><i class="fas fa-sync"></i> Rafraîchir</button>
            <button class="btn" onclick="exportResults()"><i class="fas fa-download"></i> Exporter CSV</button>
        </div>
    </div>
    
    <script>
        const ADMIN_SECRET = 'admin2026';
        
        async function loadResults() {
            try {
                const response = await fetch(`/api/results?admin_secret=${ADMIN_SECRET}`);
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                // Mettre à jour les stats
                document.getElementById('totalVotes').textContent = data.total_votes || 0;
                document.getElementById('participationRate').textContent = data.election?.participation_rate || '0%';
                document.getElementById('timeRemaining').textContent = data.election?.temps_restant || '0j';
                
                // Mettre à jour le tableau
                const tbody = document.querySelector('#resultsTable tbody');
                tbody.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(result => {
                        const row = document.createElement('tr');
                        if (result.rank === 1) row.className = 'winner';
                        
                        row.innerHTML = `
                            <td>${result.rank}</td>
                            <td><strong>${result.candidate.nom_complet}</strong></td>
                            <td>${result.candidate.classe}</td>
                            <td>${result.votes}</td>
                            <td>${result.percentage}%</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
                
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur de chargement des résultats');
            }
        }
        
        function exportResults() {
            // Logique d'export CSV
            alert('Export CSV - Fonctionnalité à implémenter');
        }
        
        // Charger au démarrage
        document.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
