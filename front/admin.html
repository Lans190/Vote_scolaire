<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Résultats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #4361ee, #3a0ca3); color: white; padding: 30px; border-radius: 15px; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .results { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
        .winner { background: rgba(46, 204, 113, 0.1); }
        .btn { padding: 10px 20px; background: #4361ee; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 5px; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-lock"></i> Administration - Résultats 2026</h1>
            <p>Cours privés La Source de la Fontaine</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalVotes">0</h3>
                <p>Votes totaux</p>
            </div>
            <div class="stat-card">
                <h3 id="participationRate">0%</h3>
                <p>Participation</p>
            </div>
            <div class="stat-card">
                <h3 id="topCandidate">-</h3>
                <p>En tête</p>
            </div>
        </div>
        
        <div class="results">
            <h2><i class="fas fa-chart-bar"></i> Résultats</h2>
            <button class="btn" onclick="loadResults()"><i class="fas fa-sync"></i> Rafraîchir</button>
            
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Rang</th>
                        <th>Candidate</th>
                        <th>Classe</th>
                        <th>Votes</th>
                        <th>%</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadResults() {
            try {
                const response = await fetch(`/api/results?admin_secret=admin2026`);
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                // Stats
                document.getElementById('totalVotes').textContent = data.total_votes || 0;
                
                // Table
                const tbody = document.querySelector('#resultsTable tbody');
                tbody.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach((result, index) => {
                        const row = document.createElement('tr');
                        if (index === 0) row.className = 'winner';
                        
                        const percentage = data.total_votes > 0 ? 
                            ((result.votes / data.total_votes) * 100).toFixed(1) : 0;
                        
                        row.innerHTML = `
                            <td>${index + 1}</td>
                            <td><strong>${result.nom_complet}</strong></td>
                            <td>${result.classe}</td>
                            <td>${result.votes}</td>
                            <td>${percentage}%</td>
                        `;
                        tbody.appendChild(row);
                    });
                    
                    // Top candidate
                    document.getElementById('topCandidate').textContent = data.results[0]?.nom_complet || '-';
                    
                    // Participation
                    const participation = data.total_votes > 0 ? 
                        Math.round((data.total_votes / 50) * 100) : 0;
                    document.getElementById('participationRate').textContent = participation + '%';
                }
                
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur de chargement');
            }
        }
        
        // Charger au démarrage
        document.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
