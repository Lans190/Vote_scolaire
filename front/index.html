<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Élections 2026 • La Source de la Fontaine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Votre contenu HTML existant -->
    
    <!-- CHANGER L'ORDRE DES SCRIPTS -->
    <script src="config.js"></script>  <!-- EN PREMIER -->
    <script src="script.js"></script>  <!-- EN SECOND -->
    
    <!-- Ou si vous avez un seul fichier -->
    <script>
        // Code inline pour tester
        console.log('🌐 URL actuelle:', window.location.href);
        console.log('🔍 Test API direct...');
        
        // Tester directement
        fetch('https://vote-scolaire.onrender.com/api/status')
            .then(r => r.json())
            .then(data => {
                console.log('✅ API OK:', data.system?.ecole);
                document.getElementById('status').textContent = 'Connecté à ' + data.system?.ecole;
            })
            .catch(e => {
                console.error('❌ API Error:', e);
                document.getElementById('status').textContent = 'Erreur connexion';
            });
    </script>
</body>
</html>
