<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Vote Scolaire 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 2.5em;
            color: #4361ee;
            margin-bottom: 10px;
        }
        
        .results-table {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .results-table th {
            background: #4361ee;
            color: white;
            padding: 15px;
            text-align: left;
        }
        
        .results-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .results-table tr:nth-child(even) {
            background: #f8f9fa;
        }
        
        .winner-badge {
            background: #2ecc71;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .export-btn {
            background: #4361ee;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .export-btn:hover {
            background: #3a0ca3;
        }
        
        .admin-warning {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-lock"></i> Administration - Vote Scolaire 2026</h1>
            <p>Cours privés Source de la Fontaine • Accès réservé</p>
        </div>
        
        <div class="admin-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <strong>Accès restreint :</strong> Cette page est réservée à l'administration.
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <!-- Les statistiques seront chargées ici -->
        </div>
        
        <h2><i class="fas fa-chart-bar"></i> Résultats détaillés</h2>
        <div class="results-table-container">
            <table class="results-table" id="resultsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Candidate</th>
                        <th>Classe</th>
                        <th>Votes</th>
                        <th>Pourcentage</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <!-- Les résultats seront chargés ici -->
                </tbody>
            </table>
        </div>
        
        <h2><i class="fas fa-users"></i> Liste des votants</h2>
        <div class="results-table-container">
            <table class="results-table" id="votersTable">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Date du vote</th>
                        <th>Candidate</th>
                    </tr>
                </thead>
                <tbody id="votersBody">
                    <!-- Les votants seront chargés ici -->
                </tbody>
            </table>
        </div>
        
        <div class="export-buttons">
            <button class="export-btn" onclick="exportToExcel()">
                <i class="fas fa-file-excel"></i> Exporter Excel
            </button>
            <button class="export-btn" onclick="exportToPDF()">
                <i class="fas fa-file-pdf"></i> Exporter PDF
            </button>
            <button class="export-btn" onclick="printResults()">
                <i class="fas fa-print"></i> Imprimer
            </button>
            <button class="export-btn" onclick="goBack()" style="background: #6c757d;">
                <i class="fas fa-arrow-left"></i> Retour
            </button>
        </div>
    </div>

    <script>
        const ADMIN_SECRET = 'admin_vote_2026_source_fontaine';
        const API_BASE = window.location.origin;
        
        async function loadAdminData() {
            try {
                // Charger les résultats
                const resultsResponse = await fetch(`${API_BASE}/api/results?admin_secret=${ADMIN_SECRET}`);
                const resultsData = await resultsResponse.json();
                
                // Charger les statistiques
                const statsResponse = await fetch(`${API_BASE}/api/stats?admin_secret=${ADMIN_SECRET}`);
                const statsData = await statsResponse.json();
                
                // Afficher les données
                displayStats(statsData);
                displayResults(resultsData);
                displayVoters(statsData);
                
            } catch (error) {
                console.error('Erreur chargement admin:', error);
                alert('Accès refusé ou erreur de connexion');
                window.location.href = '/';
            }
        }
        
        function displayStats(data) {
            const statsGrid = document.getElementById('statsGrid');
            if (!statsGrid) return;
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3 id="totalVotes">${data.total_votes || 0}</h3>
                    <p>Votes totaux</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalCandidates">${data.total_candidates || 0}</h3>
                    <p>Candidates</p>
                </div>
                <div class="stat-card">
                    <h3 id="participationRate">${data.participation_rate || 0}%</h3>
                    <p>Taux de participation</p>
                </div>
                <div class="stat-card">
                    <h3 id="votes24h">${data.votes_last_24h || 0}</h3>
                    <p>Votes (24h)</p>
                </div>
            `;
        }
        
        function displayResults(data) {
            const resultsBody = document.getElementById('resultsBody');
            if (!resultsBody || !data.results) return;
            
            resultsBody.innerHTML = '';
            
            data.results.forEach((result, index) => {
                const row = document.createElement('tr');
                const isWinner = index === 0;
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${result.candidate.nom_complet}</strong></td>
                    <td>${result.candidate.classe}</td>
                    <td><strong>${result.votes}</strong></td>
                    <td>${result.percentage.toFixed(1)}%</td>
                    <td>${isWinner ? '<span class="winner-badge">Gagnante</span>' : ''}</td>
                `;
                
                resultsBody.appendChild(row);
            });
        }
        
        function displayVoters(data) {
            const votersBody = document.getElementById('votersBody');
            if (!votersBody || !data.votants) return;
            
            votersBody.innerHTML = '';
            
            data.votants.forEach(voter => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${voter.email}</td>
                    <td>${new Date(voter.date_vote).toLocaleString('fr-FR')}</td>
                    <td>${voter.candidate_id ? 'Candidate #' + voter.candidate_id : 'N/A'}</td>
                `;
                
                votersBody.appendChild(row);
            });
        }
        
        function exportToExcel() {
            alert('Export Excel - Fonctionnalité à implémenter');
        }
        
        function exportToPDF() {
            window.print();
        }
        
        function printResults() {
            window.print();
        }
        
        function goBack() {
            window.location.href = '/';
        }
        
        // Charger les données au démarrage
        document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
