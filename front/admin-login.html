<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Administration - La Source de la Fontaine</title>
    <meta name="description" content="Espace administration - Élections 2026">
    
    <style>
        /* ========== RESET & VARIABLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        :root {
            --primary: #0d47a1;
            --primary-dark: #0a3a7a;
            --primary-light: #1565c0;
            --danger: #c62828;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-600: #6c757d;
            --gray-900: #212529;
            --shadow: 0 10px 40px rgba(0,0,0,0.1);
            --border-radius: 24px;
        }

        /* ========== BACKGROUND ========== */
        body {
            background-image: url('/assets/source.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 5vw, 32px);
        }

        /* ========== CONTAINER LOGIN ========== */
        .login-wrapper {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: clamp(30px, 8vw, 48px);
            box-shadow: var(--shadow);
            border-left: 6px solid var(--primary);
            width: 100%;
        }

        /* ========== HEADER AVEC LOGO ========== */
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .school-logo {
            height: clamp(70px, 15vw, 100px);
            width: auto;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .admin-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: clamp(0.9rem, 3vw, 1rem);
            margin-bottom: 16px;
        }

        h1 {
            color: var(--primary);
            font-size: clamp(1.5rem, 6vw, 2rem);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--gray-600);
            font-size: clamp(0.95rem, 3vw, 1.1rem);
        }

        /* ========== FORMULAIRE ========== */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--gray-900);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .password-input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input {
            width: 100%;
            padding: clamp(14px, 4vw, 16px);
            padding-right: 50px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .password-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: var(--gray-600);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
        }

        /* ========== BOUTON ========== */
        .btn-login {
            width: 100%;
            padding: clamp(14px, 4vw, 16px);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: clamp(1rem, 4vw, 1.1rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 71, 161, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* ========== MESSAGE ERREUR ========== */
        .error-message {
            background: #ffebee;
            color: var(--danger);
            padding: 14px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            border-left: 4px solid var(--danger);
        }

        /* ========== FOOTER ========== */
        .login-footer {
            margin-top: 32px;
            text-align: center;
            color: var(--gray-600);
            font-size: 0.9rem;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            color: var(--primary);
            font-weight: 500;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
            }
            
            .btn-login {
                padding: 14px;
            }
            
            .admin-badge {
                padding: 6px 16px;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 20px;
            }
            
            .school-logo {
                height: 60px;
            }
        }

        /* ========== ANIMATIONS ========== */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            animation: slideIn 0.4s ease-out;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- LOGO FONTAINE -->
            <div class="logo-section">
                <img src="/assets/fontaine.png" 
                     alt="Logo La Source de la Fontaine" 
                     class="school-logo"
                     loading="eager">
                
                <div class="admin-badge">
                    <i class="fas fa-shield-alt"></i>
                    Espace Administration
                </div>
                
                <h1>
                    <i class="fas fa-user-shield"></i>
                    Connexion
                </h1>
                <p class="subtitle">
                    Cours privés La Source de la Fontaine
                </p>
            </div>

            <!-- FORMULAIRE DE CONNEXION -->
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    Mot de passe administrateur
                </label>
                <div class="password-input-group">
                    <input type="password" 
                           id="password" 
                           class="password-input"
                           placeholder="Entrez votre mot de passe"
                           autocomplete="off"
                           aria-label="Mot de passe administrateur">
                    <button type="button" 
                            class="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Afficher/masquer le mot de passe">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button onclick="login()" class="btn-login">
                <i class="fas fa-sign-in-alt"></i>
                Se connecter
            </button>

            <!-- MESSAGE D'ERREUR -->
            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Mot de passe incorrect</span>
            </div>

            <!-- FOOTER -->
            <div class="login-footer">
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i>
                    Accès strictement réservé
                </div>
                <p style="margin-top: 12px;">
                    Élections des Délégués 2026
                </p>
            </div>
        </div>
    </div>

    <script>
        // ========== CONNEXION ==========
        function login() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            if (password === 'admin2026') {
                // Connexion réussie
                window.location.href = '/admin-dashboard';
            } else {
                // Afficher erreur
                errorDiv.style.display = 'flex';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                
                // Animation erreur
                errorDiv.style.animation = 'none';
                errorDiv.offsetHeight;
                errorDiv.style.animation = 'slideIn 0.3s ease-out';
            }
        }

        // ========== AFFICHER/MASQUER MOT DE PASSE ==========
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        // ========== GESTION TOUCHE ENTRÉE ==========
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // ========== CACHER MESSAGE ERREUR ==========
        document.getElementById('password').addEventListener('focus', function() {
            document.getElementById('errorMessage').style.display = 'none';
        });
    </script>
</body>
</html>
