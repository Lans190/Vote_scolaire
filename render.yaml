services:
  # Base de données PostgreSQL
  - type: postgres
    name: vote-postgres
    databaseName: vote
    user: vote_user
    
  # Backend API
  - type: web
    name: vote-backend
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vote-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/status
    
  # Frontend - POINTANT VERS "front/" au lieu de "frontend/"
  - type: web
    name: vote-frontend
    runtime: node
    rootDir: front      ← CHANGÉ ICI
    buildCommand: |
      npm install
    startCommand: npm start
    envVars:
      - key: API_URL
        fromService:
          name: vote-backend
          type: web
          property: host