services:
  - type: web
    name: vote-scolaire-2026
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.8
    disk:
      name: votes-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1