services:
  - type: web
    name: vote-scolaire-la-source
    env: python
    region: frankfurt
    rootDirectory: backend  # IMPORTANT: Spécifier le dossier backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 10000
    healthCheckPath: /api/status
    autoDeploy: true